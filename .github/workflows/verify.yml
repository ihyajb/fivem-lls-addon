name: Verify
on:
  push:
    branches-ignore: []
  pull_request:
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Catches a library edited without rebuilding the index, and any parse
      # regression: the builder cross-checks its own declaration count against
      # the files and enforces a floor per game.
      - name: Check native index is current
        run: node scripts/build-index.mjs --check
