name: (temp) Diagnose native sources

on:
  push:
    branches:
      - claude/native-generation-sync-2s43wx
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and inspect native JSON endpoints
        run: |
          node <<'EOF'
          const ENDPOINTS = {
            'static natives.json':      'https://static.cfx.re/natives/natives.json',
            'static natives_cfx.json':  'https://static.cfx.re/natives/natives_cfx.json',
            'runtime natives.json':     'https://runtime.fivem.net/doc/natives.json',
            'runtime natives_cfx.json': 'https://runtime.fivem.net/doc/natives_cfx.json',
          };

          // GTA V Enhanced-era natives (NativeDB builds >= 3570)
          const ENHANCED = {
            '0x875BDD898B99C8CE': 'GET_PLAYER_TARGETING_MODE (b3570)',
            '0x686ECCD99D4E61BB': 'SET_PED_WAYPOINT_PROGRESS (b3570)',
            '0xAB286B2192A71E32': 'NETWORK_HAS_SC_MEMBERSHIP (b3717)',
            '0x6CB5B84B78AC55FE': 'SET_VEHICLE_TAIL_BROKEN (b3717)',
            '0xC12A19AC871A59C1': 'SET_ENTITY_DRAWABLE_LOD_THRESHOLDS (b3889)',
            '0xE6200F3AF46AC0B5': 'SET_PLAYER_STEALTH_SPEED (b3889)',
            '0xD6FAD05D855AF80F': 'GET_RENDERED_TEXT_PADDING_SIZE (b3889)',
          };

          const NAME_PROBES = ['CREATE_COLSHAPE_CIRCLE', 'COLSHAPE'];

          (async () => {
            for (const [label, url] of Object.entries(ENDPOINTS)) {
              console.log('\n=================================================');
              console.log(label, '->', url);
              let res, json;
              try {
                res = await fetch(url);
                console.log('  HTTP', res.status, '| last-modified:', res.headers.get('last-modified'), '| length:', res.headers.get('content-length'));
                if (!res.ok) continue;
                json = await res.json();
              } catch (e) {
                console.log('  FETCH FAILED:', e.message);
                continue;
              }

              const namespaces = Object.keys(json);
              let total = 0;
              const hashes = new Set();
              const names = new Set();
              for (const ns of namespaces) {
                for (const [hash, native] of Object.entries(json[ns])) {
                  total++;
                  hashes.add(hash.toUpperCase());
                  if (native && native.name) names.add(native.name.toUpperCase());
                }
              }
              console.log('  namespaces:', namespaces.length, '| natives:', total);
              console.log('  namespace list:', namespaces.join(', '));

              console.log('  -- GTA V Enhanced-era natives (NativeDB b3570+) --');
              let present = 0;
              for (const [hash, desc] of Object.entries(ENHANCED)) {
                const hit = hashes.has(hash);
                if (hit) present++;
                console.log(`     ${hit ? 'PRESENT' : 'MISSING'}  ${hash}  ${desc}`);
              }
              console.log(`     => ${present}/${Object.keys(ENHANCED).length} present`);

              console.log('  -- name probes --');
              for (const probe of NAME_PROBES) {
                const matches = [...names].filter((n) => n.includes(probe));
                console.log(`     ${probe}: ${matches.length} match(es)${matches.length ? ' -> ' + matches.slice(0, 20).join(', ') : ''}`);
              }
            }
          })();
          EOF
